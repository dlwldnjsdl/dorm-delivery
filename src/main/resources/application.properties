spring.application.name=dorm-delivery

spring.datasource.url=jdbc:mysql://localhost:3306/dorm_delivery?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
push.enabled=${WEB_PUSH_ENABLED:false}
push.public-key=${VAPID_PUBLIC_KEY:}
push.private-key=${VAPID_PRIVATE_KEY:}
push.subject=${VAPID_SUBJECT:}
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
