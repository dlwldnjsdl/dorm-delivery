<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DormDelivery 채팅 테스트</title>
</head>
<body>

<h2>DormDelivery 실시간 채팅 테스트</h2>

<div>
    <label>방 번호:</label>
    <input id="roomId" value="4">
</div>

<br>

<div>
    <label>사용자 ID:</label>
    <input id="senderId" value="1">
</div>

<br>

<div>
    <label>이름:</label>
    <input id="senderName" value="leejw">
</div>

<br>

<button onclick="connect()">채팅방 연결</button>

<hr>

<input id="message" placeholder="메시지 입력">
<button onclick="sendMessage()">전송</button>

<hr>

<h3>채팅</h3>
<div id="chat"></div>

<script>
    let socket;
    let connected = false;

    function connect() {
        const roomId = document.getElementById("roomId").value;

        socket = new WebSocket("ws://localhost:8080/ws");

        socket.onopen = function () {
            const connectFrame =
                "CONNECT\n" +
                "accept-version:1.2\n" +
                "host:localhost\n\n" +
                "\0";

            socket.send(connectFrame);
        };

        socket.onmessage = function (event) {
            const data = event.data;

            if (data.startsWith("CONNECTED")) {
                connected = true;

                const subscribeFrame =
                    "SUBSCRIBE\n" +
                    "id:sub-0\n" +
                    "destination:/topic/rooms/" +
                    roomId +
                    "\n\n\0";

                socket.send(subscribeFrame);

                addChat("채팅방 연결 성공");
                return;
            }

            if (data.startsWith("MESSAGE")) {
                const bodyStart = data.indexOf("\n\n") + 2;
                const bodyEnd = data.lastIndexOf("\0");

                const body = data.substring(bodyStart, bodyEnd);

                try {
                    const message = JSON.parse(body);

                    addChat(
                        message.senderName +
                        " : " +
                        message.message
                    );
                } catch (e) {
                    addChat(body);
                }
            }
        };

        socket.onerror = function () {
            addChat("WebSocket 연결 오류");
        };

        socket.onclose = function () {
            connected = false;
            addChat("연결 종료");
        };
    }

    function sendMessage() {
        if (!connected) {
            alert("먼저 채팅방 연결 버튼을 눌러!");
            return;
        }

        const roomId = document.getElementById("roomId").value;
        const senderId = document.getElementById("senderId").value;
        const senderName = document.getElementById("senderName").value;
        const message = document.getElementById("message").value;

        const body = JSON.stringify({
            roomId: Number(roomId),
            senderId: Number(senderId),
            senderName: senderName,
            message: message
        });

        const length =
            new TextEncoder().encode(body).length;

        const sendFrame =
            "SEND\n" +
            "destination:/app/chat/" +
            roomId +
            "\n" +
            "content-type:application/json\n" +
            "content-length:" +
            length +
            "\n\n" +
            body +
            "\0";

        socket.send(sendFrame);

        document.getElementById("message").value = "";
    }

    function addChat(text) {
        const div = document.getElementById("chat");
        const p = document.createElement("p");

        p.innerText = text;
        div.appendChild(p);
    }
</script>

</body>
</html>
