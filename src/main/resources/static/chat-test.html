<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DormDelivery 채팅 테스트</title>
</head>
<body>

<h2>DormDelivery 채팅 테스트</h2>

<h3>로그인</h3>

<div>
    <label>전화번호:</label>
    <input id="phone" value="01012345678">
</div>

<br>

<div>
    <label>비밀번호:</label>
    <input id="password" type="password" value="1234">
</div>

<br>

<button onclick="login()">로그인</button>
<button onclick="logout()">로그아웃</button>

<p id="loginStatus">로그인 안 됨</p>

<hr>

<h3>채팅방</h3>

<div>
    <label>방 번호:</label>
    <input id="roomId" value="4">
</div>

<br>

<button onclick="connect()">채팅방 연결</button>

<hr>

<input id="message" placeholder="메시지 입력">
<button onclick="sendMessage()">전송</button>

<hr>

<h3>채팅</h3>

<div id="chat"></div>

<script>

    let socket;
    let connected = false;
    let currentUser = null;


    // 로그인
    async function login() {

        const phone =
            document.getElementById("phone").value;

        const password =
            document.getElementById("password").value;

        const response = await fetch("/users/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                phone: phone,
                password: password
            })
        });

        if (!response.ok) {
            alert("로그인 실패");
            return;
        }

        currentUser = await response.json();

        document.getElementById("loginStatus").innerText =
            "로그인됨 : " +
            currentUser.name +
            " (User ID: " +
            currentUser.id +
            ")";
    }


    // 현재 로그인 사용자 확인
    async function loadCurrentUser() {

        const response =
            await fetch("/users/me");

        if (!response.ok) {
            currentUser = null;

            document.getElementById("loginStatus").innerText =
                "로그인 안 됨";

            return;
        }

        currentUser =
            await response.json();

        document.getElementById("loginStatus").innerText =
            "로그인됨 : " +
            currentUser.name +
            " (User ID: " +
            currentUser.id +
            ")";
    }


    // 로그아웃
    async function logout() {

        await fetch("/users/logout", {
            method: "POST"
        });

        currentUser = null;
        connected = false;

        if (socket) {
            socket.close();
        }

        document.getElementById("loginStatus").innerText =
            "로그인 안 됨";

        document.getElementById("chat").innerHTML = "";
    }


    // 이전 채팅 불러오기
    async function loadHistory(roomId) {

        const response =
            await fetch("/chats/room/" + roomId);

        const messages =
            await response.json();

        messages.forEach(function(message) {

            addChat(
                message.senderName +
                " : " +
                message.message
            );

        });
    }


    // 채팅방 연결
    async function connect() {

        if (currentUser == null) {
            alert("먼저 로그인해!");
            return;
        }

        const roomId =
            document.getElementById("roomId").value;

        document.getElementById("chat").innerHTML = "";

        await loadHistory(roomId);

        socket =
            new WebSocket("ws://localhost:8080/ws");

        socket.onopen = function () {

            const connectFrame =
                "CONNECT\n" +
                "accept-version:1.2\n" +
                "host:localhost\n\n" +
                "\0";

            socket.send(connectFrame);
        };


        socket.onmessage = function (event) {

            const data = event.data;

            if (data.startsWith("CONNECTED")) {

                connected = true;

                const subscribeFrame =
                    "SUBSCRIBE\n" +
                    "id:sub-0\n" +
                    "destination:/topic/rooms/" +
                    roomId +
                    "\n\n\0";

                socket.send(subscribeFrame);

                addChat(
                    "채팅방 연결 성공 - " +
                    currentUser.name
                );

                return;
            }


            if (data.startsWith("MESSAGE")) {

                const bodyStart =
                    data.indexOf("\n\n") + 2;

                const bodyEnd =
                    data.lastIndexOf("\0");

                const body =
                    data.substring(
                        bodyStart,
                        bodyEnd
                    );

                try {

                    const message =
                        JSON.parse(body);

                    addChat(
                        message.senderName +
                        " : " +
                        message.message
                    );

                } catch (e) {

                    addChat(body);
                }
            }
        };


        socket.onerror = function () {
            addChat("WebSocket 연결 오류");
        };


        socket.onclose = function () {
            connected = false;
            addChat("연결 종료");
        };
    }


    // 메시지 전송
    function sendMessage() {

        if (currentUser == null) {
            alert("먼저 로그인해!");
            return;
        }

        if (!connected) {
            alert("먼저 채팅방 연결을 눌러!");
            return;
        }

        const roomId =
            document.getElementById("roomId").value;

        const message =
            document.getElementById("message").value;

        if (message.trim() === "") {
            return;
        }

        const body =
            JSON.stringify({

                roomId:
                    Number(roomId),

                senderId:
                    currentUser.id,

                message:
                    message
            });


        const length =
            new TextEncoder()
                .encode(body)
                .length;


        const sendFrame =
            "SEND\n" +
            "destination:/app/chat/" +
            roomId +
            "\n" +
            "content-type:application/json\n" +
            "content-length:" +
            length +
            "\n\n" +
            body +
            "\0";


        socket.send(sendFrame);

        document.getElementById("message").value = "";
    }


    function addChat(text) {

        const div =
            document.getElementById("chat");

        const p =
            document.createElement("p");

        p.innerText = text;

        div.appendChild(p);
    }


    // 페이지 열리면 기존 로그인 여부 확인
    loadCurrentUser();

</script>

</body>
</html>
